name: medischedule-api
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: medischedule
      POSTGRES_USER: ${DB_USER:-medischedule}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Ustaw DB_PASSWORD w pliku .env}
    ports: ["127.0.0.1:${DB_PORT:-5434}:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d medischedule"]
      interval: 3s
      timeout: 3s
      retries: 20
  backend:
    build: ./backend
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/medischedule
      DB_USER: ${DB_USER:-medischedule}
      DB_PASSWORD: ${DB_PASSWORD:?Ustaw DB_PASSWORD w pliku .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      DEMO_ENABLED: ${DEMO_ENABLED:-false}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      MAIL_ENABLED: ${MAIL_ENABLED:-true}
      MAIL_FROM: ${MAIL_FROM:-no-reply@medischedule.local}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-false}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
    ports: ["127.0.0.1:${BACKEND_PORT:-8081}:8080"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      start_period: 15s
      retries: 20
    depends_on:
      db: {condition: service_healthy}
  frontend:
    build: ./frontend
    ports: ["127.0.0.1:${FRONTEND_PORT:-8088}:80"]
    depends_on:
      backend: {condition: service_healthy}
  mailpit:
    image: axllent/mailpit:v1.34.0
    ports: ["127.0.0.1:${MAILPIT_PORT:-8025}:8025"]
    environment:
      MP_DATABASE: /data/mailpit.db
    volumes: ["maildata:/data"]
  tests:
    profiles: [test]
    image: maven:3.9-eclipse-temurin-21
    working_dir: /workspace
    volumes:
      - ./backend:/workspace
      - maven-cache:/root/.m2
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      TESTCONTAINERS_HOST_OVERRIDE: host.docker.internal
    command: mvn -B -ntp test
volumes:
  pgdata:
  maven-cache:
  maildata:
