name: medischedule-api
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: medischedule
      POSTGRES_USER: ${DB_USER:-medischedule}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Ustaw DB_PASSWORD w pliku .env}
    ports: ["127.0.0.1:${DB_PORT:-5434}:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d medischedule"]
      interval: 3s
      timeout: 3s
      retries: 20
  backend:
    build: ./backend
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/medischedule
      DB_USER: ${DB_USER:-medischedule}
      DB_PASSWORD: ${DB_PASSWORD:?Ustaw DB_PASSWORD w pliku .env}
    ports: ["127.0.0.1:${BACKEND_PORT:-8081}:8080"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      start_period: 15s
      retries: 20
    depends_on:
      db: {condition: service_healthy}
volumes:
  pgdata:
