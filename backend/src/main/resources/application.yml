spring:
  application:
    name: medischedule
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5434/medischedule}
    username: ${DB_USER:medischedule}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health
